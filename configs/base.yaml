# ─────────────────────────────────────────────────────────────────────────────
# MISM base configuration  (all default values)
# Override individual keys in derived configs or via --override CLI flags.
# ─────────────────────────────────────────────────────────────────────────────

model:
  model_name:          "ai-forever/FRED-T5-1.7B"
  # hidden_size, num_heads, ffn_dim are auto-inferred from the T5 backbone.
  # For FRED-T5-1.7B: d_model=1536, num_heads=24, d_ff=4096
  dropout:             0.1
  window_size:         512
  window_overlap:      128
  max_windows:         32
  max_kw:              20
  kw_max_len:          32
  max_summary_tokens:  256
  max_src_len:         4096

training:
  # Stage 1: freeze encoders + decoder → train Fusion + KAL only
  stage1_epochs:        5
  stage1_lr:            1.0e-4

  # Stage 2: freeze encoders → train Fusion + KAL + Decoder
  stage2_epochs:        15
  stage2_lr:            5.0e-5

  # Per-GPU batch size  (effective = batch_size × grad_accum_steps × world_size)
  batch_size:           2
  grad_accum_steps:     16      # effective batch ≈ 2 × 16 × 8 GPUs = 256
  max_grad_norm:        1.0
  warmup_ratio:         0.05
  weight_decay:         0.01
  bf16:                 false
  gradient_checkpointing: true
  seed:                 42

loss:
  lambda_gen:           0.50
  lambda_cover:         0.15
  lambda_bert:          0.10
  lambda_gate:          0.10
  lambda_kw:            0.15
  label_smoothing:      0.1
  gate_threshold_low:   0.2
  gate_threshold_high:  0.4

data:
  train_path:  "dataset/splits/train.json"
  val_path:    "dataset/splits/val.json"
  test_path:   "dataset/splits/test.json"

logging:
  wandb_project:    "mism-summarization"
  wandb_run_name:   null           # auto-generated by W&B
  use_wandb:        true
  use_tensorboard:  true
  log_every_steps:  50
  eval_every_steps: 500
  save_every_steps: 1000

output:
  checkpoint_dir:  "checkpoints"
