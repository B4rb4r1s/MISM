# ─────────────────────────────────────────────────────────────────────────────
# MISM — GAZETA_2STAGE configuration (FRED-T5-1.7B backbone)
# Inherits all defaults from base.yaml; only differences are listed here.
# ─────────────────────────────────────────────────────────────────────────────

model:
  model_name: "ai-forever/FRED-T5-1.7B"

training:
  stage1_epochs:   5
  stage1_lr:       1.0e-4
  stage2_epochs:   15
  stage2_lr:       5.0e-5
  batch_size:      2
  grad_accum_steps: 16
  bf16:            false
  gradient_checkpointing: true
  seed:            42

logging:
  wandb_project:   "mism-summarization"
  wandb_run_name:  "fred-t5-1.7b_2stage"
  use_tensorboard: true

output:
  checkpoint_dir: "checkpoints/fred_t5_1.7b_2stage"
